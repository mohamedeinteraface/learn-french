<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre les chiffres</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: #e3f7ff;
            text-align: center;
        }
        h1 {
            color: #1e90ff;
        }
        .number {
            display: inline-block;
            margin: 10px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .number:hover {
            transform: scale(1.2);
            background: #ccefff;
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <h1>🔢 Apprendre les chiffres</h1>
    {% for number in numbers %}
        <div class="number" onclick="playSound('{{ number.sound }}')">
            <h2>{{ number.num }}</h2>
            <img src="{{ url_for('static', filename='images/' + number.image) }}">
        </div>
    {% endfor %}

    <audio id="audio" src=""></audio>

    <script>
        function playSound(filename) {
            const audio = document.getElementById('audio');
            audio.src = "{{ url_for('static', filename='sounds/') }}" + filename;
            audio.play();
        }
    </script>
</body>
</html>
