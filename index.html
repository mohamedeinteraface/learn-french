<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprentissage pour enfants</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: #fff4e6;
            text-align: center;
        }
        h1 {
            color: #ff6f61;
            margin-top: 50px;
        }
        .button {
            display: inline-block;
            margin: 20px;
            padding: 30px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 20px;
            background: #ffd9c0;
            color: #333;
            text-decoration: none;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .button:hover {
            transform: scale(1.1);
            background: #ffb380;
        }
        .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>👶 Bienvenue à l'apprentissage ! yassin tati</h1>

    <!-- زر الحروف -->
    <a href="/letters" class="button">
        <span class="emoji">📖</span>
        Apprendre les lettres
    </a>

    <!-- زر الأرقام -->
    <a href="/numbers" class="button">
        <span class="emoji">🔢</span>
        Apprendre les chiffres
    </a>
</body>
</html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprendre les lettres</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: #fffae3;
            text-align: center;
        }
        h1 {
            color: #ff6f61;
        }
        .letter {
            display: inline-block;
            margin: 15px;
            padding: 20px;
            background: #fff7f0;
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .letter:hover {
            transform: scale(1.2);
            background: #ffd9c0;
        }
        img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>📖 Apprendre les lettres</h1>
    {% for letter in letters %}
        <div class="letter" onclick="playSound('{{ letter.sound }}')">
            <h2>{{ letter.char }}</h2>
            <img src="{{ url_for('static', filename='images/' + letter.image) }}">
        </div>
    {% endfor %}

    <audio id="audio" src=""></audio>

    <script>
        function playSound(filename) {
            const audio = document.getElementById('audio');
            audio.src = "{{ url_for('static', filename='sounds/') }}" + filename;
            audio.play();
        }
    </script>
</body>
</html>
