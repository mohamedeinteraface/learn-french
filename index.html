<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprentissage pour enfants</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #fff4e6;
        }
        h1 { color: #ff6f61; margin-top: 20px; }

        .button {
            display: inline-block;
            margin: 20px;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 20px;
            background: #ffd9c0;
            color: #333;
            text-decoration: none;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            cursor: pointer;
        }
        .button:hover {
            transform: scale(1.1);
            background: #ffb380;
        }

        .section { display: none; padding: 20px; }
        .active { display: block; }

        .letter, .number {
            display: inline-block;
            margin: 10px;
            padding: 15px;
            background: #fff7f0;
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .letter:hover, .number:hover { transform: scale(1.2); }

        img { width: 80px; height: 80px; }

        /* ألوان مختلفة لكل قسم */
        #letters { background: #fffae3; }
        #numbers { background: #e3f7ff; }
    </style>
</head>
<body>

    <h1>👶 Bienvenue à l'apprentissage !</h1>

    <div>
        <button class="button" onclick="showSection('home')">Accueil</button>
        <button class="button" onclick="showSection('letters')">Apprendre les lettres 📖</button>
        <button class="button" onclick="showSection('numbers')">Apprendre les chiffres 🔢</button>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="home" class="section active">
        <p>Choisissez une section pour commencer l'apprentissage !</p>
    </div>

    <!-- صفحة الحروف -->
    <div id="letters" class="section">
        <h1>📖 Apprendre les lettres</h1>
    </div>

    <!-- صفحة الأرقام -->
    <div id="numbers" class="section">
        <h1>🔢 Apprendre les chiffres</h1>
    </div>

    <audio id="audio" src=""></audio>

    <script>
        // بيانات الحروف
        const letters = [
            {char: 'A', image: 'a.png', sound: 'a.mp3'},
            {char: 'B', image: 'b.png', sound: 'b.mp3'},
            {char: 'C', image: 'c.png', sound: 'c.mp3'},
            {char: 'D', image: 'd.png', sound: 'd.mp3'},
            {char: 'E', image: 'e.png', sound: 'e.mp3'},
            {char: 'F', image: 'f.png', sound: 'f.mp3'},
            {char: 'G', image: 'g.png', sound: 'g.mp3'},
            {char: 'H', image: 'h.png', sound: 'h.mp3'},
            {char: 'I', image: 'i.png', sound: 'i.mp3'},
            {char: 'J', image: 'j.png', sound: 'j.mp3'},
            {char: 'K', image: 'k.png', sound: 'k.mp3'},
            {char: 'L', image: 'l.png', sound: 'l.mp3'},
            {char: 'M', image: 'm.png', sound: 'm.mp3'},
            {char: 'N', image: 'n.png', sound: 'n.mp3'},
            {char: 'O', image: 'o.png', sound: 'o.mp3'},
            {char: 'P', image: 'p.png', sound: 'p.mp3'},
            {char: 'Q', image: 'q.png', sound: 'q.mp3'},
            {char: 'R', image: 'r.png', sound: 'r.mp3'},
            {char: 'S', image: 's.png', sound: 's.mp3'},
            {char: 'T', image: 't.png', sound: 't.mp3'},
            {char: 'U', image: 'u.png', sound: 'u.mp3'},
            {char: 'V', image: 'v.png', sound: 'v.mp3'},
            {char: 'W', image: 'w.png', sound: 'w.mp3'},
            {char: 'X', image: 'x.png', sound: 'x.mp3'},
            {char: 'Y', image: 'y.png', sound: 'y.mp3'},
            {char: 'Z', image: 'z.png', sound: 'z.mp3'}
        ];

        // بيانات الأرقام من 1 إلى 99
        const numbers = [];
        for(let i = 1; i <= 99; i++){
            numbers.push({num: i, image: i + '.png', sound: i + '.mp3'});
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function playSound(filename) {
            const audio = document.getElementById('audio');
            audio.src = "static/sounds/" + filename;
            audio.play();
        }

        // إنشاء الحروف ديناميكيًا
        const lettersDiv = document.getElementById('letters');
        letters.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'letter';
            div.onclick = () => playSound(letter.sound);
            div.innerHTML = `<h2>${letter.char}</h2><img src="static/images/${letter.image}">`;
            lettersDiv.appendChild(div);
        });

        // إنشاء الأرقام ديناميكيًا
        const numbersDiv = document.getElementById('numbers');
        numbers.forEach(number => {
            const div = document.createElement('div');
            div.className = 'number';
            div.onclick = () => playSound(number.sound);
            div.innerHTML = `<h2>${number.num}</h2><img src="static/images/${number.image}">`;
            numbersDiv.appendChild(div);
        });
    </script>

</body>
</html>
