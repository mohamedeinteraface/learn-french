<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Apprentissage pour enfants</title>
    <style>
        body {
            font-family: "Comic Sans MS", cursive, sans-serif;
            background: #fff4e6;
            text-align: center;
        }
        h1 {
            color: #ff6f61;
            margin-top: 50px;
        }
        .button {
            display: inline-block;
            margin: 20px;
            padding: 30px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 20px;
            background: #ffd9c0;
            color: #333;
            text-decoration: none;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        .button:hover {
            transform: scale(1.1);
            background: #ffb380;
        }
        .emoji {
            font-size: 50px;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>👶 Bienvenue à l'apprentissage ! yassin tati</h1>

    <!-- زر الحروف -->
    <a href="/letters" class="button">
        <span class="emoji">📖</span>
        Apprendre les lettres
    </a>

    <!-- زر الأرقام -->
    <a href="/numbers" class="button">
        <span class="emoji">🔢</span>
        Apprendre les chiffres
    </a>
</body>
</html>
